<!DOCTYPE html>
<!--
  index.html - chat page for the AI Tutor.

  Author: Shivank Agrawal
  Project: AI Tutor (Agentic RAG) - Future with Shivank

  Plain HTML + JavaScript, no build step. It:
    1. loads the source picker from GET /api/tools
    2. sends {message, threadId, sources} to POST /api/chat
    3. reads the Server-Sent Events stream and renders, live:
       tool steps -> answer text (markdown) -> source cards
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Tutor - Future with Shivank</title>
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<style>
  :root { --ink:#1f2328; --muted:#656d76; --line:#e3e6ea; --bg:#f7f8fa; --accent:#2f5bd3; --chip:#eef2fc; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.55 -apple-system, "Segoe UI", Roboto, sans-serif; color:var(--ink); background:var(--bg); display:flex; height:100vh; }
  aside { width:270px; background:#fff; border-right:1px solid var(--line); padding:20px; display:flex; flex-direction:column; gap:16px; }
  aside h1 { font-size:18px; margin:0; }
  aside .sub { color:var(--muted); font-size:13px; margin-top:2px; }
  .label { font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }
  .source { display:flex; gap:8px; align-items:flex-start; padding:6px 0; cursor:pointer; }
  .source small { color:var(--muted); display:block; }
  .model { font-size:13px; background:var(--chip); padding:6px 10px; border-radius:6px; }
  button { font:inherit; border:1px solid var(--line); background:#fff; border-radius:8px; padding:8px 12px; cursor:pointer; }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  main { flex:1; display:flex; flex-direction:column; min-width:0; }
  #chat { flex:1; overflow-y:auto; padding:24px max(24px, calc(50% - 400px)); }
  .msg { margin-bottom:22px; }
  .msg.user .bubble { background:var(--accent); color:#fff; padding:10px 14px; border-radius:12px; display:inline-block; max-width:85%; }
  .msg.user { text-align:right; }
  .msg.tutor .bubble { background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px 18px; }
  .steps { font-size:13px; color:var(--muted); margin-bottom:8px; }
  .step { font-family:ui-monospace, Menlo, monospace; font-size:12px; padding:3px 0; }
  .step.done::before { content:"✓ "; color:#1a7f37; }
  .step.running::before { content:"… "; }
  .answer pre { background:#f6f8fa; padding:12px; border-radius:8px; overflow-x:auto; }
  .answer code { font-size:13px; }
  .sources { display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; }
  .sources a { font-size:12px; background:var(--chip); color:var(--accent); padding:4px 8px; border-radius:6px; text-decoration:none; }
  .error { color:#cf222e; }
  form { display:flex; gap:10px; padding:16px max(24px, calc(50% - 400px)); border-top:1px solid var(--line); background:#fff; }
  textarea { flex:1; font:inherit; border:1px solid var(--line); border-radius:10px; padding:10px 12px; resize:none; height:48px; }
</style>
</head>
<body>
<aside>
  <div>
    <h1>AI Tutor</h1>
    <div class="sub">Agentic RAG · Future with Shivank</div>
  </div>
  <div>
    <div class="label">Sources</div>
    <div id="sources"></div>
  </div>
  <div class="model" id="model">model: …</div>
  <button id="new-chat">New chat</button>
</aside>

<main>
  <div id="chat"></div>
  <form id="form">
    <textarea id="input" placeholder="Ask about LoRA, TRL trainers or the OpenAI Agents SDK…"></textarea>
    <button class="primary" type="submit">Send</button>
  </form>
</main>

<script>
let threadId = "";  // returned by the server in the first event; sent back for follow-ups

// 1) Build the source picker from the server's config.
async function loadTools() {
  const info = await (await fetch("/api/tools")).json();
  document.getElementById("model").textContent = "model: " + info.model;
  document.getElementById("sources").innerHTML = info.sources.map(s => `
    <label class="source"><input type="checkbox" value="${s.key}" checked>
      <span>${s.label}<small>${s.pages} pages</small></span></label>`).join("");
}

function selectedSources() {
  return [...document.querySelectorAll("#sources input:checked")].map(i => i.value);
}

function addMessage(role, html) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.innerHTML = `<div class="bubble">${html}</div>`;
  document.getElementById("chat").appendChild(div);
  div.scrollIntoView({ block: "end" });
  return div.querySelector(".bubble");
}

function escapeHtml(text) {
  return text.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

// 2) Send a question and 3) render the SSE stream as it arrives.
async function send(message) {
  const sources = selectedSources();
  if (!sources.length) { alert("Select at least one source."); return; }
  addMessage("user", escapeHtml(message));
  const bubble = addMessage("tutor", `<div class="steps"></div><div class="answer"></div><div class="sources"></div>`);
  const stepsEl = bubble.querySelector(".steps"), answerEl = bubble.querySelector(".answer");
  let answer = "";

  const response = await fetch("/api/chat", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ message, threadId, sources }),
  });
  const reader = response.body.getReader();
  const decoder = new TextDecoder();
  let buffer = "";

  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });
    const events = buffer.split("\n\n");
    buffer = events.pop();  // keep an incomplete event for the next read
    for (const raw of events) {
      if (!raw.startsWith("data: ")) continue;
      const event = JSON.parse(raw.slice(6));

      if (event.type === "thread") threadId = event.threadId;
      if (event.type === "tool-call") {
        const arg = event.args.query || event.args.command || JSON.stringify(event.args);
        stepsEl.insertAdjacentHTML("beforeend",
          `<div class="step running" id="step-${event.id}">${event.name}: ${escapeHtml(arg)}</div>`);
      }
      if (event.type === "tool-result") {
        const step = document.getElementById("step-" + event.id);
        if (step) step.className = "step done";
      }
      if (event.type === "text-delta") {
        answer += event.delta;
        answerEl.innerHTML = DOMPurify.sanitize(marked.parse(answer));
      }
      if (event.type === "sources") {
        bubble.querySelector(".sources").innerHTML = event.sources.map(s =>
          `<a href="${s.url}" target="_blank" rel="noopener">${escapeHtml(s.title)} · ${s.source}</a>`).join("");
      }
      if (event.type === "error") {
        answerEl.innerHTML += `<p class="error">${escapeHtml(event.message)}</p>`;
      }
      bubble.scrollIntoView({ block: "end" });
    }
  }
}

document.getElementById("form").addEventListener("submit", e => {
  e.preventDefault();
  const input = document.getElementById("input");
  const message = input.value.trim();
  if (message) { input.value = ""; send(message); }
});
document.getElementById("input").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); document.getElementById("form").requestSubmit(); }
});
document.getElementById("new-chat").addEventListener("click", () => {
  threadId = "";
  document.getElementById("chat").innerHTML = "";
});
loadTools();
</script>
</body>
</html>
